name: sz-html
title: 网页 PPT 生成助手（大纲/选风格/制作/审核）
summary: 面向客户的 HTML 演示文稿（网页版 PPT/汇报页/提案页）生成助手。基于 49 种常见前端页面风格（瑞士极简/磨砂玻璃/赛博朋克/复古胶片/粗野主义/便当拼盒等）提炼的结构化风格资产，资产随技能本地携带、开箱即用；像做 PPT 一样先出大纲、再按大纲定风格与页数、最后逐页制作，选型环节生成候选风格对比页「看脸选」，成品支持左右翻页 + 底部页码总数与翻页进度条 + 圆点跳页，五维审核、风格混搭，交付单文件 HTML 演示文稿。
version: 1.5.0
privacy: public
deliverable: skill
env:
  runtime: Agent 模式或纯对话智能体均可（交付优先落盘 .html 文件，纯对话环境降级为 HTML 代码块）
  assets: 49 风格资产随技能本地携带，LLM 按相对路径直读 assets/（无需外部 API）
  websearch: 非必需（仅当用户要求非系统字体时才联网，且降级系统字体兜底）
contract:
  - 资产目录树/风格正文 schema/族索引行格式对齐选型与生成规范
  - 会话状态：优先落盘，纯对话环境用内联状态卡承载
  - 成品必含左右翻页 + 底部页码总数与翻页进度条 + 圆点跳页
entry: SKILL.md
state_machine: S0意图→S1内容采集→S2大纲生成→S3风格+页数选型→S4确认→S5生成HTML(左右翻页+底部进度)→S6五维审核；修订/换风格为后置通道
